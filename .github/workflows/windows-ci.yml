# =============================================================================
# Windows CI Workflow
# =============================================================================
# Purpose:
#   Validates library builds and tests pass on Windows platform.
#   Runs on every push and PR to main/develop branches.
#
# Tests:
#   - Library build
#   - Unit tests
#   - Integration tests
#
# Platform:
#   - Windows Server 2022 (windows-latest)
#   - GNAT FSF via Alire
# =============================================================================

name: Windows CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug logging'
        required: false
        default: 'false'

jobs:
  windows-build-and-test:
    name: Windows Build & Test
    runs-on: windows-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # Setup Alire
      # -----------------------------------------------------------------------
      - name: Setup Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.0.2

      # -----------------------------------------------------------------------
      # Replace local pins with GitHub URL pins for CI
      # -----------------------------------------------------------------------
      - name: Update dependency pins for CI
        shell: bash
        run: |
          # Replace local path pins with GitHub URL pins
          sed -i "s|functional = { path = '../functional' }|functional = { url = \"https://github.com/abitofhelp/functional.git\", commit = \"5ef5b46d9dce871edebec5aefcb3d24d35eb9026\" }|" alire.toml
          sed -i "s|tzif = { path = '../tzif' }|tzif = { url = \"https://github.com/abitofhelp/tzif_ada.git\", commit = \"f585c7a1625b26aaa768f8162b641d657a71e012\" }|" alire.toml
          echo "Updated pins to use GitHub URLs"
          echo "=== alire.toml pins ==="
          grep -A5 '^\[\[pins\]\]' alire.toml || true

      # -----------------------------------------------------------------------
      # Build library
      # -----------------------------------------------------------------------
      - name: Build library
        shell: bash
        run: |
          echo "Building zoneinfo library for Windows..."
          alr build -- -j4
          echo "Library build complete"

      # -----------------------------------------------------------------------
      # Build unit tests
      # -----------------------------------------------------------------------
      - name: Build unit tests
        shell: bash
        run: |
          echo "Building unit tests..."
          alr exec -- gprbuild -P test/unit/unit_tests.gpr -p -j4
          echo "Unit tests build complete"

      # -----------------------------------------------------------------------
      # Build integration tests
      # -----------------------------------------------------------------------
      - name: Build integration tests
        shell: bash
        run: |
          echo "Building integration tests..."
          alr exec -- gprbuild -P test/integration/integration_tests.gpr -p -j4
          echo "Integration tests build complete"

      # -----------------------------------------------------------------------
      # Run unit tests
      # -----------------------------------------------------------------------
      - name: Run unit tests
        shell: bash
        run: |
          echo "========================================"
          echo "Running Unit Tests"
          echo "========================================"
          ./test/bin/unit_runner.exe
          echo "Unit tests complete"

      # -----------------------------------------------------------------------
      # Run integration tests
      # -----------------------------------------------------------------------
      - name: Run integration tests
        shell: bash
        run: |
          echo "========================================"
          echo "Running Integration Tests"
          echo "========================================"
          ./test/bin/integration_runner.exe
          echo "Integration tests complete"

      # -----------------------------------------------------------------------
      # Test Summary
      # -----------------------------------------------------------------------
      - name: Test Summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Windows CI Complete"
          echo "========================================"
          echo "Platform: windows-latest (Windows Server 2022)"
          echo "Alire: 2.0.2"
          echo ""
          echo "Tests executed:"
          echo "  - Unit tests"
          echo "  - Integration tests"
